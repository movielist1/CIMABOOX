  <script>
    (function detectDevice() {
      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      var isIos = /iPad|iPhone|iPod/.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));

      var gpBtn = document.getElementById('googlePlayBtn');
      var asBtn = document.getElementById('appStoreBtn');

      if (isAndroid && gpBtn) {
        gpBtn.classList.add('recommended');
      } else if (isIos && asBtn) {
        asBtn.classList.add('recommended');
      }
    })();

    function handleStoreClick(platform) {
      var cfg = window.CIMA_CONFIG || {};
      var targetUrl = platform === 'google_play' ? cfg.googlePlayUrl : cfg.appStoreUrl;
      var alertBox = document.getElementById('statusAlert');

      if (!targetUrl || targetUrl.trim() === '') {
        alertBox.style.display = 'block';
        alertBox.innerHTML = platform === 'google_play'
          ? '<strong>Notice:</strong> The official Google Play Store listing URL is currently being published by the owner. Please check back shortly or contact <a href="mailto:support@cimabox.online" style="color:#A78BFA;text-decoration:underline;">support@cimabox.online</a>.'
          : '<strong>Notice:</strong> The official Apple App Store listing URL is currently being published by the owner. Please check back shortly or contact <a href="mailto:support@cimabox.online" style="color:#A78BFA;text-decoration:underline;">support@cimabox.online</a>.';
        return;
      }

      window.location.href = targetUrl;
    }
  </script>
